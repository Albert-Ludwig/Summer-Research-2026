policy_cmd_vel_node:
  ros__parameters:
    control_mode: angular_half_eval
    use_diffusion_policy: true
    enable_goal_stop: true
    enable_speed_clamp: true
    enable_near_goal_slowdown: false
    enable_heading_gate: false
    enable_heading_stop: false
    enable_heading_align_override: false
    enable_speed_gain: false
    enable_sign_conflict_guard: false
    slow_down_radius: 1.2
    min_approach_speed: 0.04
    near_goal_angular_scale: 0.6
    heading_gate_rad: 0.8
    heading_stop_rad: 1.4
    heading_align_kp: 0.8
    heading_align_min_abs_w: 0.10
    heading_align_override_rad: 0.8
    heading_align_override_near_goal_only: true
    sign_conflict_heading_error_rad: 0.35
    sign_conflict_min_raw_angular: 0.10
    sign_conflict_linear_scale: 0.0
    sign_conflict_align_kp: 0.6
    sign_conflict_min_abs_w: 0.08
    sign_conflict_max_abs_w: 0.8
    max_linear_speed: 1.0
    max_angular_speed: 1.5707963267948966
    max_linear_accel: 1.5
    max_angular_accel: 1.5707963267948966
    goal_tolerance: 0.20
    bridge_goal_tolerance: 0.20
    goal_timeout_sec: 150.0
    stop_when_goal_reached: true
    robot_v_pref: 1.0
    robot_radius: 0.25
    human_radius: 0.25
    sync_policy_warm_start_from_odom: false
    sync_prev_action_from_odom: false
    cmd_publish_period_sec: 0.1
    diffusion_inference_period_sec: 0.1
    command_hold_timeout_sec: 1.0
    enable_projected_trajectory_sampling: true
    projected_trajectory_fallback_to_hold: true
    enable_policy_warmup: true
    warmup_on_startup: true
    warmup_goal_x_robot_frame: 2.0
    warmup_goal_y_robot_frame: 0.0
    warmup_timeout_sec: 240.0
    publish_cmd_during_warmup: false
    target_policy_frame: map
    enable_tf_transforms: true
    tf_lookup_timeout_sec: 0.1
    allow_tf_fallback_raw: false
    people_frame: map
    enable_static_map_to_policy: true
    static_map_update_on_change_only: true
    occupied_threshold: 50
    max_static_map_cells: 20000
    treat_unknown_as_occupied: false
    reset_policy_state_on_new_goal: true
    reset_policy_state_on_goal_reached: true

nav2_goal_to_pose_bridge:
  ros__parameters:
    goal_tolerance: 0.20
    policy_goal_tolerance: 0.20
    action_timeout_sec: 150.0
